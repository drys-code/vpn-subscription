name: Update VPN subscription

on:
  schedule:
    # Каждые 10 минут. Время в UTC.
    - cron: "*/10 * * * *"

  # Ручной запуск из вкладки Actions
  workflow_dispatch:

  # Внешний запуск через GitHub API, если понадобится позже
  repository_dispatch:
    types:
      - update-vpn

permissions:
  contents: write

concurrency:
  group: update-vpn
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check servers and publish subscription
        env:
          SOURCE_URL: https://tiagorrg.github.io/vless-checker/keys.json
          OUT_DIR: docs
          TIMEOUT: "3"
          MAX_SERVERS: "200"
          MAX_WORKERS: "20"
          # --- НОВЫЕ НАСТРОЙКИ ---
          MAX_ALIVE_SERVERS: "4"
          INCLUDE_COUNTRIES: ""
          EXCLUDE_COUNTRIES: ""
        run: |
          python tools/update.py

      - name: Commit and push if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add docs

          if git diff --staged --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update VPN list $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi